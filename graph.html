<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Notidian 그래프</title>
    <style>
      :root { --bg: #ffffff; --text: #1d2330; --focus: #c01c28; --page: #2563eb; --db: #c2410c; --unreadable: #6b7280; }
      /* hidden 속성이 아래 display 지정에 덮이지 않게 한다(안내 문구가 그래프 위에 남던 버그) */
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; }
      body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
      header { padding: 8px; border-bottom: 1px solid var(--text); }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
      .row:last-child { margin-bottom: 0; }
      button, input { font: inherit; color: inherit; background: transparent; border: 1px solid var(--text); border-radius: 4px; padding: 4px 8px; }
      button { cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: default; }
      button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
      button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
      .combo { position: relative; }
      #search { min-width: 12em; }
      #search-list { position: absolute; z-index: 10; top: 100%; left: 0; min-width: 100%; max-height: 40vh; margin: 2px 0 0; padding: 0; overflow: auto; list-style: none; background: var(--bg); border: 1px solid var(--text); }
      #search-list li { padding: 4px 8px; cursor: pointer; }
      #search-list li[aria-selected="true"] { background: var(--text); color: var(--bg); }
      /* 범례는 눌러서 그 종류를 숨기거나 보이는 필터를 겸한다. 숨긴 상태는 색이 아니라 줄긋기·흐림으로도 알린다 */
      .legend button[aria-pressed] { background: transparent; color: inherit; }
      .legend button[aria-pressed="false"] { opacity: 0.55; text-decoration: line-through; }
      .swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; vertical-align: -1px; }
      .swatch.page { background: var(--page); border-radius: 50%; }
      .swatch.db { background: var(--db); }
      .swatch.unreadable { width: 6px; height: 6px; border: 2px dashed var(--unreadable); border-radius: 50%; }
      main { flex: 1; min-height: 0; position: relative; }
      #graph-area, #list-view { position: absolute; inset: 0; }
      #graph { position: absolute; inset: 0; overflow: hidden; }
      .zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
      .zoom button { background: var(--bg); min-width: 36px; min-height: 36px; }
      #empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; margin: 0; padding: 16px; text-align: center; }
      #list-view { overflow: auto; padding: 8px 12px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid color-mix(in srgb, var(--text) 25%, var(--bg)); }
      th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
      td button { white-space: nowrap; }
      /* 선택한 페이지의 받은·보낸 연결. 옆 패널처럼 좁으면 위아래로 쌓이고, 목록이 길면 그 안에서 스크롤한다 */
      .links { flex-basis: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(14em, 1fr)); gap: 4px 16px; }
      .links h2 { font-size: 13px; margin: 0; }
      .links .hint { font-size: 12px; margin: 0 0 2px; opacity: 0.8; }
      .links ul { list-style: none; margin: 0; padding: 0; max-height: 6.5em; overflow: auto; }
      .links li button { border: none; padding: 1px 4px; text-align: left; text-decoration: underline; }
      .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <div role="group" aria-label="보기 방식">
          <button id="mode-side" type="button" aria-pressed="false">옆 패널</button>
          <button id="mode-center" type="button" aria-pressed="false">가운데 창</button>
          <button id="mode-full" type="button" aria-pressed="false">전체 화면</button>
        </div>
        <div class="combo">
          <label>제목 검색
            <input id="search" type="text" role="combobox" aria-expanded="false" aria-controls="search-list" aria-autocomplete="list" autocomplete="off" />
          </label>
          <ul id="search-list" role="listbox" aria-label="검색 결과" hidden></ul>
        </div>
        <button id="view-toggle" type="button">목록으로 보기</button>
      </div>
      <div class="row legend" role="group" aria-label="점 종류. 눌러서 보이거나 숨겨요">
        <button id="legend-page" type="button" aria-pressed="true"><span class="swatch page" aria-hidden="true"></span>페이지</button>
        <button id="legend-db" type="button" aria-pressed="true"><span class="swatch db" aria-hidden="true"></span>DB 항목</button>
        <button id="legend-unreadable" type="button" aria-pressed="true"><span class="swatch unreadable" aria-hidden="true"></span>읽을 수 없는 페이지</button>
        <label><input id="hierarchy" type="checkbox" /> 하위 페이지 선 보기</label>
      </div>
      <div class="row">
        <span id="status"></span>
        <button id="reindex" type="button" aria-describedby="reindex-hint">연결 지도 만들기</button>
        <button id="open-settings" type="button">설정 열기</button>
        <span id="reindex-hint" hidden>먼저 설정에서 토큰을 저장해 주세요.</span>
      </div>
      <div id="selection" class="row" role="region" aria-label="선택한 페이지" hidden>
        <span>선택한 페이지: <strong id="sel-title"></strong></span>
        <button id="sel-open" type="button">Notion에서 열기</button>
        <button id="sel-clear" type="button">선택 해제</button>
        <div class="links">
          <section aria-labelledby="in-title"><h2 id="in-title">받은 연결</h2><p class="hint">이 페이지를 가리키는 페이지</p><ul id="sel-in"></ul></section>
          <section aria-labelledby="out-title"><h2 id="out-title">보낸 연결</h2><p class="hint">이 페이지가 가리키는 페이지</p><ul id="sel-out"></ul></section>
        </div>
      </div>
      <div id="notice" role="status" aria-live="polite"></div>
    </header>
    <main>
      <div id="graph-area">
        <div id="graph" role="img" aria-label="페이지 연결 그래프. 키보드로는 위의 제목 검색이나 목록 보기로 페이지를 고르고 열 수 있어요."></div>
        <div class="zoom" role="group" aria-label="화면 조절">
          <button id="zoom-in" type="button" aria-label="확대" title="확대">+</button>
          <button id="zoom-out" type="button" aria-label="축소" title="축소">−</button>
          <button id="zoom-fit" type="button" aria-label="전체 보기" title="전체 보기">⤢</button>
        </div>
        <div id="empty" hidden>
          <p id="empty-text">아직 그릴 연결이 없어요. 설정에서 토큰을 넣고 "연결 지도 만들기"를 눌러 주세요.</p>
          <button id="empty-settings" type="button">설정 열기</button>
        </div>
      </div>
      <section id="list-view" aria-label="페이지 목록" hidden>
        <p id="list-note"></p>
        <p>받은 연결은 이 페이지를 가리키는 페이지 수, 보낸 연결은 이 페이지가 가리키는 페이지 수예요.</p>
        <table>
          <thead>
            <tr><th scope="col">이름</th><th scope="col">종류</th><th scope="col" class="num">받은 연결</th><th scope="col" class="num">보낸 연결</th><th scope="col"><span class="sr-only">열기</span></th></tr>
          </thead>
          <tbody id="list-body"></tbody>
        </table>
      </section>
    </main>
    <p id="live" class="sr-only" aria-live="polite"></p>
    <p id="progress-live" class="sr-only" aria-live="polite"></p>
    <script type="module" src="/src/extension/graph-view/main.ts"></script>
  </body>
</html>
